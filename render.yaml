# Render Blueprint: despliegue con Docker + PostgreSQL (plan free)
databases:
  - name: cmap-db
    databaseName: trabajadores_activos_cmap
    user: cmap
    plan: free
    region: oregon

services:
  - type: web
    name: web-cmap
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /index.php
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cmap-db
          property: connectionString
      - key: DB_SETUP_KEY
        value: CAMBIA-ESTA-CLAVE
      - key: IG_ACCESS_TOKEN
        value: ''
      - key: IG_USER_ID
        value: ''